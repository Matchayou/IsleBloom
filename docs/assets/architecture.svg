<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Research Island architecture</title><desc id="desc">React workspace calls the local API. Domain services use dynamic context and a controlled SDK executor. DBOS coordinates background work. PostgreSQL and local files persist state and artifacts.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#527665" stroke-width="1.4"/></marker></defs><rect width="1200" height="900" rx="24" fill="#f8f7ef"/><g font-family="Arial, sans-serif"><text x="48" y="53" fill="#30634e" font-size="15" font-weight="700" letter-spacing="3">RESEARCH ISLAND / SYSTEM MAP</text><text x="48" y="98" fill="#243e32" font-size="32" font-weight="700">From a question to a traceable result.</text><rect x="48" y="133" width="1104" height="90" rx="16" fill="#e8f2e5" stroke="#c9d6c7" stroke-width="1.5"/><text x="72" y="167" fill="#244d3b" font-size="19" font-weight="700">01  /  RESEARCH WORKSPACE</text><text x="72" y="195" fill="#57685c" font-size="16">React + Vite  ·  Branch conversations  ·  Plan confirmation  ·  Expert Flow  ·  Files &amp; run analysis</text><path d="M600 223V248" fill="none" stroke="#527665" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="252" width="1104" height="89" rx="16" fill="#fffdf6" stroke="#c9d6c7" stroke-width="1.5"/><text x="72" y="286" fill="#244d3b" font-size="19" font-weight="700">02  /  LOCAL HTTP API</text><text x="72" y="314" fill="#57685c" font-size="16">Starlette + Uvicorn  ·  Commands &amp; revisions  ·  Authorization checks  ·  SSE response streaming</text><path d="M600 341V366" fill="none" stroke="#527665" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="370" width="537" height="123" rx="16" fill="#fffdf6" stroke="#c9d6c7" stroke-width="1.5"/><text x="72" y="404" fill="#244d3b" font-size="19" font-weight="700">03  /  DOMAIN SERVICES</text><text x="72" y="432" fill="#57685c" font-size="16">Projects &amp; research  ·  Versioned resources &amp; evidence</text><text x="72" y="455" fill="#57685c" font-size="16">Expert tasks &amp; routing  ·  Independent review / revision</text><text x="72" y="478" fill="#57685c" font-size="16">Methods  ·  Evaluation  ·  Learning</text><rect x="615" y="370" width="537" height="123" rx="16" fill="#fffdf6" stroke="#c9d6c7" stroke-width="1.5"/><text x="639" y="404" fill="#244d3b" font-size="19" font-weight="700">04  /  DYNAMIC CONTEXT</text><text x="639" y="432" fill="#57685c" font-size="16">Task-scoped inputs  ·  User / project / specialist memory</text><text x="639" y="455" fill="#57685c" font-size="16">On-demand skills &amp; tool groups  ·  Source references</text><text x="639" y="478" fill="#57685c" font-size="16">Token budgeting  ·  Compaction &amp; paged originals</text><path d="M585 431H610" fill="none" stroke="#527665" stroke-width="2" marker-end="url(#arrow)"/><path d="M315 493V530" fill="none" stroke="#527665" stroke-width="2" marker-end="url(#arrow)"/><path d="M882 493V514H740V530" fill="none" stroke="#527665" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="534" width="737" height="137" rx="16" fill="#e8f2e5" stroke="#c9d6c7" stroke-width="1.5"/><text x="72" y="568" fill="#244d3b" font-size="19" font-weight="700">05  /  CONTROLLED EXECUTION</text><text x="72" y="596" fill="#57685c" font-size="16">Frozen request &amp; permissions  →  Broker  →  OpenAI Agents SDK</text><text x="72" y="619" fill="#57685c" font-size="16">Model / tool ledger  ·  Checkpoints  ·  Output validation</text><text x="72" y="642" fill="#57685c" font-size="16">OpenAI Responses-compatible endpoint  ·  Authorized tools</text><rect x="815" y="534" width="337" height="137" rx="16" fill="#fffdf6" stroke="#c9d6c7" stroke-width="1.5"/><text x="839" y="568" fill="#244d3b" font-size="19" font-weight="700">06  /  DURABLE JOBS</text><text x="839" y="596" fill="#57685c" font-size="16">DBOS background workflows</text><text x="839" y="619" fill="#57685c" font-size="16">Resume confirmed steps</text><text x="839" y="642" fill="#57685c" font-size="16">Pause uncertain operations</text><path d="M815 602H790" fill="none" stroke="#527665" stroke-width="2" marker-end="url(#arrow)"/><path d="M315 671V714" fill="none" stroke="#527665" stroke-width="2" marker-end="url(#arrow)"/><path d="M700 671V691H882V714" fill="none" stroke="#527665" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="718" width="537" height="119" rx="16" fill="#fffdf6" stroke="#c9d6c7" stroke-width="1.5"/><text x="72" y="752" fill="#244d3b" font-size="19" font-weight="700">07  /  POSTGRESQL</text><text x="72" y="780" fill="#57685c" font-size="16">Business state  ·  Immutable result versions</text><text x="72" y="803" fill="#57685c" font-size="16">Execution ledger  ·  Memory  ·  DBOS state</text><rect x="615" y="718" width="537" height="119" rx="16" fill="#fffdf6" stroke="#c9d6c7" stroke-width="1.5"/><text x="639" y="752" fill="#244d3b" font-size="19" font-weight="700">08  /  LOCAL FILE STORAGE</text><text x="639" y="780" fill="#57685c" font-size="16">Uploaded source blobs  ·  Delivered files</text><text x="639" y="803" fill="#57685c" font-size="16">Private context artifacts  ·  Source projections</text><text x="48" y="874" font-size="14" fill="#6b7a6b">Single-host workspace · Agent review, human approval, adoption and publication are separate states.</text><path d="M980 671V704H510V714" fill="none" stroke="#527665" stroke-width="2" marker-end="url(#arrow)"/></g></svg>