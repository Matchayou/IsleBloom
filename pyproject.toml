[project]
name = "research-agent-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "dbos==3.0.0",
    "docling==2.129.0",
    "httpx==0.28.1",
    "openai-agents==0.22.2",
    "pillow==12.3.0",
    "psycopg[binary]==3.2.10",
    "pypdfium2==5.13.0",
    "pyyaml==6.0.3",
    "routellm==0.2.0",
    "sqlalchemy==2.0.43",
    "starlette==1.6.0",
    "uvicorn==0.53.0",
]
[project.scripts]
agent-methods = "agent_core.methods_cli:main"
agent-research = "agent_core.research_cli:main"
agent-resources = "agent_core.resources_cli:main"
agent-dispatch = "agent_core.dispatch_cli:main"
agent-records = "agent_core.records_cli:main"
agent-tasks = "agent_core.tasks_cli:main"
agent-evals = "agent_core.evaluation_cli:main"
agent-evolution = "agent_core.evolution_cli:main"
[dependency-groups]
dev = ["pytest==9.0.3", "pytest-asyncio==1.3.0"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
